<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .product {
            width: 300px;
            background: white;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .product img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price {
            color: green;
            font-size: 25px;
            font-weight: bold;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #555;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>

</head>
<body>
    <header>
        <h1>My Store</h1>
    </header>


    <div class="product">

        <img src="https://via.placeholder.com/250" alt="Product">

        <h2>Awesome Product</h2>

        <p>
            This is a simple product description.
            It is high quality and useful.
        </p>

        <p class="price">$29.99</p>

        <button>Add to Cart</button>

    </div>


    <footer>
        <p>© 2026 My Store</p>
    </footer>

</body>
</html>
